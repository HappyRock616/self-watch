// Find my watch: ring the watch from the phone.
// Ref: Gadgetbridge 160beab41 GBProtobufGenerator/src/main/proto/garmin/gdi_find_my_watch.proto
//   FindMyWatchService (1, 2, 3, 4), FindMyWatchRequest (1), response status (1; 0, 100, 200)
syntax = "proto2";

package selfwatch.garmin.find;

option java_package = "app.selfwatch.garmin.pb.proto";
option java_outer_classname = "FindMyWatchProto";

message FindMyWatchService {
    optional FindRequest find_request = 1;
    optional FindResponse find_response = 2;
    optional CancelRequest cancel_request = 3;
    optional FindResponse cancel_response = 4;
}

message FindRequest {
    optional int32 timeout = 1;
}

message CancelRequest {
}

message FindResponse {
    enum Status {
        UNKNOWN_RESPONSE_STATUS = 0;
        OK = 100;
        ERROR = 200;
    }
    optional Status status = 1;
}
