// Data transfer: the watch pulls a large answer (registered under an id, see http.proto DataTransferItem)
// in pieces with DataDownloadRequest (A23).
// Ref: Gadgetbridge 160beab41 GBProtobufGenerator/src/main/proto/garmin/gdi_data_transfer.proto
//   DataTransferService (1, 2), DataDownloadRequest (1, 2, 3), DataDownloadResponse (1..4; statuses 0..3)
syntax = "proto2";

package selfwatch.garmin.transfer;

option java_package = "app.selfwatch.garmin.pb.proto";
option java_outer_classname = "DataTransferProto";

message DataTransferService {
    optional DataDownloadRequest data_download_request = 1;
    optional DataDownloadResponse data_download_response = 2;
}

message DataDownloadRequest {
    required uint32 id = 1;
    required uint32 offset = 2;
    optional uint32 max_chunk_size = 3;
}

message DataDownloadResponse {
    enum Status {
        UNKNOWN = 0;
        SUCCESS = 1;
        INVALID_ID = 2;
        INVALID_OFFSET = 3;
    }
    required Status status = 1;
    required uint32 id = 2;
    required uint32 offset = 3;
    optional bytes payload = 4;
}
