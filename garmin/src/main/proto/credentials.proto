// Garmin Connect sign-in requests, so Self Watch can recognise them and (only with garmin.fake_auth,
// COMPATIBILITY R1) answer them.
// Ref: Gadgetbridge 160beab41 GBProtobufGenerator/src/main/proto/garmin/gdi_credentials.proto
//   CredentialsService (1, 2), GCOAuthCredentialsResponse (1, 2), OAuthCredentials (1..4), GCSLocation (0..3)
syntax = "proto2";

package selfwatch.garmin.credentials;

option java_package = "app.selfwatch.garmin.pb.proto";
option java_outer_classname = "CredentialsProto";

message CredentialsService {
    optional OAuthRequest gc_oauth_request = 1;
    optional OAuthResponse gc_oauth_response = 2;
}

message OAuthRequest {
}

enum ServerLocation {
    PRODUCTION = 0;
    CHINA = 1;
    TEST = 2;
    STAGE = 3;
}

message OAuthCredentials {
    required string consumer_key = 1;
    required string consumer_secret = 2;
    required string oauth_token = 3;
    required string oauth_secret = 4;
}

message OAuthResponse {
    required OAuthCredentials oauth_credentials = 1;
    required ServerLocation location = 2;
}
